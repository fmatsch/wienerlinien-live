name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend-Tests (inkl. Replay aufgezeichneter API-Antworten)
        run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxprüfung Frontend und Desktop-App
        run: |
          node --check web/app.js
          node --check app/main.js
          node --check app/updater.js
          node --check app/release.js
      - name: Hackberry-Starter
        run: python -m py_compile hackberry/wl_live.py
